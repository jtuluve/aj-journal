<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>
    <div class="login" id="loginid">
        <div class="login-in" id="login-inid">
            <!-- <i class="fa-solid fa-circle-xmark" id="xmarklogin"></i> -->
            <div class="login-head">
                <h1>LOGIN</h1>
            </div>
            <div class="txt-field">
                <input type="email" required>
                <span></span>
                <label>Email id<label>
            </div>
            <div class="txt-field">
                <input type="password" required>
                <span></span>
                <label>Password</label>
            </div>
            <div class="txt-field">
                <input type="captcha" required>
                <span></span>
                <label>Captcha</label>
            </div>
            <br>
            <div class="pass">Forget Password?</div>
            <input type="submit" value="Login">
            <div class="signup">
                Don't have an account?<a href="#" id="toreg">Register</a>
            </div>
        </div>
    </div>
    <div class="reg" id="regid">
        <div class="register" id="registerid">
            <!-- <i class="fa-solid fa-circle-xmark" id="xmarkreg"></i> -->
            <div class="login-head">
                <h1>REGISTER</h1>
            </div>
            <div class="txt-field">
                <input type="name" required>
                <span></span>
                <label>Name</label>
            </div>
            <div class="txt-field">
                <input type="designation" required>
                <span></span>
                <label>Designation</label>
            </div>
            <div class="txt-field">
                <input type="department" required>
                <span></span>
                <label>Department</label>
            </div>
            <div class="txt-field">
                <input type="institute" required>
                <span></span>
                <label>Institute</label>
            </div>
            <div class="txt-field">
                <input type="email" required>
                <span></span>
                <label>Email id<label>
            </div>
            <div class="txt-field">
                <input type="password" required>
                <span></span>
                <label>Password</label>
            </div>
                <div class="txt-field">
                <input type="captcha" required>
                <span></span>
                <label>Captcha</label>
            </div>
            <br>
            <input type="submit" value="Register">
            <div class="signup">
                Already have an account?<a href="#"  id="tologin">Login</a>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
